server.address=0.0.0.0
server.port=${PORT:8081}

spring.messages.encoding=UTF-8

spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/prod

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.location=${java.io.tmpdir}
files.storage.root=${java.io.tmpdir}/files

logging.level.ch.verno=INFO
logging.level.org.springframework.web=INFO

verno.application.run-mode=prod
verno.application.rpc-url=${VERNO_RPC_URL:http://localhost:8081}/rpc
verno.application.api-url=${VERNO_GATEWAY_URL}
verno.application.api-username=verno

verno.billing.subscription-overview-url=https://payment.verno-app.ch
verno.billing.checkout-cancel-url=https://payment.verno-app.ch/payment
verno.billing.checkout-success-url=https://payment.verno-app.ch/success
verno.billing.portal-return-url=https://payment.verno-app.ch/payment

verno.mandant.enabled=true
verno.mandant.header-name=default
verno.mandant.allow-header-fallback=true